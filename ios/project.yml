name: FORMA
options:
  minimumXcodeGenVersion: 2.44.1
  # Generation metadata only. CI separately enforces Xcode 26.1+ / iOS 26.1+ SDK
  # for availability-gated Liquid Glass APIs; supported devices stay iOS 17+.
  xcodeVersion: "26.1"
  deploymentTarget:
    iOS: "17.0"
    # Workout mirroring to the iPhone starts at watchOS 10.
    watchOS: "10.0"
  createIntermediateGroups: true
packages:
  FORMACore:
    path: .
settings:
  base:
    # Preserve the development team already used by local device builds and CI.
    DEVELOPMENT_TEAM: 3L5A4R7JNY
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
  configs:
    Release:
      # Distributed builds must not retain test coverage instrumentation.
      ENABLE_CODE_COVERAGE: NO
      CLANG_COVERAGE_MAPPING: NO
targets:
  FORMA:
    type: application
    platform: iOS
    sources:
      - path: FORMA
        excludes:
          - Info.plist
          - FORMA.entitlements
          - Resources
          - Media
      - path: FORMA/Resources
        buildPhase: resources
      # The website's exercise media, kept as one folder in the bundle (see
      # scripts/build-ios-media.py), so 200-odd files never crowd the bundle root.
      - path: FORMA/Media
        type: folder
        buildPhase: resources
      - path: Shared
      - path: WidgetPresentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.raoufabedini.forma
        # Where accounts and sync live (HTTPS only). Surfaced through Info.plist
        # as FORMAAccountOrigin; override per build to point elsewhere, e.g.
        # xcodebuild FORMA_ACCOUNT_ORIGIN=https://staging.example.
        FORMA_ACCOUNT_ORIGIN: https://forma.raoufabedini.dev
        INFOPLIST_FILE: FORMA/Info.plist
        CODE_SIGN_ENTITLEMENTS: FORMA/FORMA.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    dependencies:
      - package: FORMACore
        product: FORMACore
      - target: FORMAWatch
      - package: FORMACore
        product: FORMASurfaces
      - target: FORMAWidgets
  FORMAWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetPresentation
      - path: FORMAWidgets
        excludes:
          - Info.plist
          - FORMAWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.raoufabedini.forma.widgets
        INFOPLIST_FILE: FORMAWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: FORMAWidgets/FORMAWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FORMA_WIDGET_EXTENSION"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: FORMACore
        product: FORMASurfaces
  FORMAWatch:
    type: application
    platform: watchOS
    sources:
      - path: FORMAWatch
        excludes:
          - Info.plist
          - FORMAWatch.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.raoufabedini.forma.watchkitapp
        INFOPLIST_FILE: FORMAWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: FORMAWatch/FORMAWatch.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
  FORMAUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FORMAUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.raoufabedini.forma.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: FORMA
    dependencies:
      - target: FORMA
  FORMAAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FORMAAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.raoufabedini.forma.apptests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: FORMA
schemes:
  FORMA:
    build:
      targets:
        FORMA: all
        FORMAUITests: [test]
        FORMAAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Opt in with `xcodebuild test -enableCodeCoverage YES` when collecting coverage.
      # A scheme-wide default also instruments Swift package dependencies in Release builds.
      gatherCoverageData: false
      targets:
        - name: FORMAAppTests
          parallelizable: false
        - name: FORMAUITests
          parallelizable: false
          randomExecutionOrder: true
    archive:
      config: Release
  FORMAWatch:
    build:
      targets:
        FORMAWatch: all
    run:
      config: Debug
    archive:
      config: Release
