name: FORMA
options:
  minimumXcodeGenVersion: 2.44.1
  # Generation metadata only. CI separately enforces Xcode 26.1+ / iOS 26.1+ SDK
  # for availability-gated Liquid Glass APIs; supported devices stay iOS 17+.
  xcodeVersion: "26.1"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FORMACore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  FORMA:
    type: application
    platform: iOS
    sources:
      - path: FORMA
        excludes:
          - Info.plist
          - Resources
      - path: FORMA/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.raoufabedini.forma
        INFOPLIST_FILE: FORMA/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    dependencies:
      - package: FORMACore
        product: FORMACore
  FORMAUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FORMAUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.raoufabedini.forma.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: FORMA
    dependencies:
      - target: FORMA
schemes:
  FORMA:
    build:
      targets:
        FORMA: all
        FORMAUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: FORMAUITests
          parallelizable: false
          randomExecutionOrder: true
    archive:
      config: Release
