version: 2
# Weekly, grouped updates keep pinned digests and SHAs from going stale.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # ESLint 10 breaks `npm ci` until the React/accessibility plugins declare
      # support (AGENT.md); raise these by hand when they do.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /ops
    schedule:
      interval: weekly
