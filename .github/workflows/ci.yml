name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build production assets
        id: build
        run: npm run build

      - name: Check production dependencies
        run: npm audit --omit=dev

      - name: Check documentation links
        run: npm run docs:check

      - name: Check patch whitespace
        run: git diff --check

      - name: Run development browser suite
        env:
          CI: "true"
        run: npm run test:browser

      - name: Run production smoke suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CI: "true"
        run: npm run test:browser:production

      - name: Upload browser reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
