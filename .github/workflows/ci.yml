name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    # Scanners run from digest-pinned images, and every step fails the job if
    # the scanner reports findings OR cannot run. A clean scan is evidence for
    # known issues only; it is not proof of security.
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full history for secret scanning
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan all history for secrets (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --no-banner --redact --log-opts=--all .

      - name: Scan the lockfile for known vulnerabilities (OSV)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
          scan source --lockfile=package-lock.json

      - name: Static analysis (Semgrep)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.170.0@sha256:c98f8829eea377274ee4b10656458b078b88232469b2ff913f091c2317347c9d
          semgrep scan --metrics=off --error --timeout 60
          --config p/javascript --config p/typescript --config p/nodejsscan --config p/secrets
          server worker src ops scripts

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Generate production SBOM (CycloneDX)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file sbom.cdx.json
          test -s sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  verify:
    name: Verify application
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: forma_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: forma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forma_test -d forma_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://forma_test:isolated-ci-only@127.0.0.1:5432/forma_test
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck backend and Worker
        run: npm run typecheck

      - name: Build backend
        run: npm run build:server

      - name: Build non-root API image
        run: |
          docker build -f ops/Dockerfile -t forma-api:ci .
          test "$(docker run --rm --entrypoint id forma-api:ci -u)" = 10001

      - name: Test real PostgreSQL identity and ownership
        run: npm run test:server

      - name: Test Worker gateway boundaries
        run: npm run test:worker

      - name: Run unit tests
        run: npm run test:unit

      - name: Build production assets
        id: build
        run: npm run build

      - name: Check production dependencies
        run: npm audit --omit=dev

      - name: Check documentation links
        run: npm run docs:check

      - name: Check patch whitespace
        run: git diff --check

      - name: Run development browser suite
        env:
          CI: "true"
        run: npm run test:browser

      - name: Run production smoke suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CI: "true"
        run: npm run test:browser:production

      - name: Run real account browser integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CI: "true"
        run: npm run test:accounts

      - name: Run production-built account browser integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CI: "true"
        run: npm run test:accounts:production

      - name: Upload browser reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
